name: Verify Altora

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm 11.8.0
        run: npm install --global npm@11.8.0
      - name: Install dependencies
        run: npm ci
      - run: npm run check:boundaries
      - run: npm test
      - run: npm run lint
      - run: npm run check-types
      - run: npm run build:static
      - name: Build Market with isolated test configuration
        env:
          AUTH_SECRET: ci-altora-market-build-secret-not-for-production
          DATABASE_URL: postgresql://altora:altora@127.0.0.1:5432/altora_market_ci
        run: npm run build:market
